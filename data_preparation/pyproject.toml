[project]
name = "overtourism-data-preparation"
version = "0.1.0"
description = "Data preparation pipeline for the Overtourism project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "odfpy",
    "openpyxl",
    "pandas",
    "pyarrow",
    "pyyaml",
    "unidecode",
    "geopandas",
    "boto3>=1.43.110",
    "digitalhub==0.15.11",
    "pytest>=9.1.1",
    "matplotlib>=3.10.9",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.2",
    "lxml>=6.1.3",
    "statsmodels>=0.15.0",
]

[project.optional-dependencies]
cloud = [
    "boto3",
    "digitalhub",
]
download = [
    "lxml",
    "requests",
]

[tool.uv]
# This repository's import package is provided by its parent directory, so it is
# used as an application environment rather than built as an installable wheel.
package = false
