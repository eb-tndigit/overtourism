# Settings of the data-preparation update pipeline.
# Edit this file as needed or use it as template for new updates
# This update covers 2025 ONLY: the base build (gen_phenomenon_dataframes.py) goes from 2022-01-01 to 2024-12-31.
# Every dataset below is restricted to the period of the update (`period.update_*` of settings.yaml, or the optional
# `period: {start: ..., end: ...}` here, never before `period.start`): rows of other periods in the files are ignored.
# Updated: presenze (vodafone + alb + extralb), popolazione, strutture, meteo and flussi OD. Consumption (ee/gas services + totals)
# is DISABLED for now: phen_consumption needs the 4 energy datasets together (ee_prelievi, gas_prelievi, ee_totale, gas_totale). See METHODOLOGY.md (`phen_consumption`) for the assumptions about the energy files.
# For the same reason the derived `phen_ee_tourism_share` (needs phen_consumption + phen_presenze + phen_meteo) is not appended either.

datasets:
  popolazione:
    enabled: true
    sources:
      - file: popolazione_2026_ISPAT.csv
        reader: csv
        adapter: popolazione_ispat_1jan
        adapter_kwargs: {year: 2025}        # uses column "Popolazione residente al 1.1.2025"

  strutture:
    enabled: true
    sources:
      - file: numero_strutture_ISPAT_2025.xlsx
        reader: excel
        reader_kwargs: {header: [0, 1]}
        adapter: strutture_annuario
        adapter_kwargs: {year: 2025}
        label: "2025"

  vodafone:
    enabled: true
    sources:
      - file: vodafone_attendences_new.csv
        reader: csv
        adapter: vodafone_raw             # 2023-01-01 .. 2025-12-31: only 2025 is used here (the base build reads it for 2024-04-01 .. 2024-12-31)

  vodafone_provenienza:
    enabled: true
    sources:                                  # same file as `vodafone`: concentration of the source markets (tourists), yearly
      - file: vodafone_attendences_new.csv    # it must contain ALL the days of the year (the index is yearly)
        reader: csv
        adapter: vodafone_raw

  vodafone_arrivi:
    enabled: true
    sources:                                  # Vodafone ARRIVALS (source countries of tourists, yearly): same layout as the presences
      - file: vodafone_arrivals.csv           # it must contain ALL the days of the year (the index is yearly)
        reader: csv
        adapter: vodafone_raw

  vodafone_tempi:
    enabled: true
    sources:
      - file: vodafone_arrivals.csv
        reader: csv
        adapter: vodafone_raw

  presenze_alb:
    enabled: true
    sources:                                  # arrivals + presences of 2025, used as downloaded (no normalization); the 2024 files of the base build
                                              # (same raw_data folder) give the stays that cross the new year
      - file: Presenze/presenze_alb_2025.csv
        reader: csv
        adapter: ispat_presenze_raw
        adapter_kwargs: {year: 2025, measure: presenze}
      - file: Presenze/arrivi_alb_2025.csv
        reader: csv
        adapter: ispat_presenze_raw
        adapter_kwargs: {year: 2025, measure: arrivi}

  presenze_extralb:
    enabled: true
    sources:                                  # arrivals + presences of 2025, used as downloaded (no normalization); the 2024 files of the base build
                                              # (same raw_data folder) give the stays that cross the new year
      - file: Presenze/arrivi_exalb_2025.csv
        reader: csv
        adapter: ispat_presenze_raw
        adapter_kwargs: {year: 2025, measure: arrivi}
      - file: Presenze/presenze_exalb_2025.csv
        reader: csv
        adapter: ispat_presenze_raw
        adapter_kwargs: {year: 2025, measure: presenze}

  ee_prelievi:
    enabled: false
    sources:               # category files (ATECO 49.3, 55.1, 56.1, 93.1, 96), read as in the base build
      - {file: Energia/ee_prelievi/49_3.csv, reader: energy_csv, adapter: energia_categorie}
      - {file: Energia/ee_prelievi/55_1.csv, reader: energy_csv, adapter: energia_categorie}
      - {file: Energia/ee_prelievi/56_1.csv, reader: energy_csv, adapter: energia_categorie}
      - {file: Energia/ee_prelievi/93_1.csv, reader: energy_csv, adapter: energia_categorie}
      - {file: Energia/ee_prelievi/96.csv, reader: energy_csv, adapter: energia_categorie}

  gas_prelievi:
    enabled: false
    sources:
      - {file: Energia/gas_prelievi/49_3.csv, reader: energy_csv, adapter: energia_categorie}
      - {file: Energia/gas_prelievi/55_1.csv, reader: energy_csv, adapter: energia_categorie}
      - {file: Energia/gas_prelievi/56_1.csv, reader: energy_csv, adapter: energia_categorie}
      - {file: Energia/gas_prelievi/93_1.csv, reader: energy_csv, adapter: energia_categorie}
      - {file: Energia/gas_prelievi/96.csv, reader: energy_csv, adapter: energia_categorie}

  ee_totale:
    enabled: false         # totals of all the usage categories (same layout of the category files, no codice_utilizzo needed)
    sources:
      - {file: Energia/ee_prelievi/totale_ee.csv, reader: energy_csv, adapter: energia_categorie}

  gas_totale:
    enabled: false
    sources:
      - {file: Energia/gas_prelievi/totale_gas.csv, reader: energy_csv, adapter: energia_categorie}

  meteo:
    enabled: true
    sources:                                  # weather of 2025, used as downloaded (no normalization): comune x day
      - file: meteo/meteo_trentino_comuni_2025.csv
        reader: csv
        adapter: meteo_comuni

  vodafone_covisits:
    enabled: true
    sources:                                  # OD co-visits: yearly flow indicators of 2025 (see METHODOLOGY.md, `phen_flussi_od`)
      - file: vodafone_covisits.csv
        reader: covisits_csv                  # chunked, keeps only the rows of the update period
        adapter: vodafone_covisits_raw
