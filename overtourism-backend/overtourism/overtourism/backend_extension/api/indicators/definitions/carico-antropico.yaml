# carico-antropico
# Vodafone presences (tourists + excursionists) per resident.
#
# See ../README.md for the format of this file.

name: Carico Antropico
category: Pressione turistica
order: 15
index_value_unit_description: Rapporto fra presenze Vodafone complessive e popolazione residente
description: >-
  L'indice misura il <strong>rapporto fra le presenze complessive</strong> rilevate attraverso i
  dati Vodafone, comprendenti turisti ed escursionisti, e la <strong>popolazione residente</strong>.
  Indica quante persone presenti in media ogni giorno, oltre ai residenti, gravano su ogni abitante.
  <strong>Fonti dei dati</strong>: Vodafone (dati della rete di telefonia mobile) per le presenze
  giornaliere di turisti ed escursionisti; ISPAT per la popolazione residente al 1° gennaio. Per le
  aree Vodafone con più comuni, i turisti sono attribuiti in proporzione ai posti letto (ISPAT) e
  gli escursionisti alla popolazione residente.

phenomena:
  - {name: population, type: PopulationPhenomenon, source: population, col: popolazione}
  - {name: presenze_vodafone, type: PresencesPhenomenon, source: presences, col: presenze_vodafone}
  - {name: presenze_escursionisti_vodafone, type: PresencesPhenomenon, source: presences, col: presenze_escursionisti_vodafone}

formula: (presenze_vodafone + presenze_escursionisti_vodafone) / population
