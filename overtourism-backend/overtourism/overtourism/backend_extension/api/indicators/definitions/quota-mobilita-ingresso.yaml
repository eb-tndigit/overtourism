# quota-mobilita-ingresso
# OD flows: share of the users present in an area who arrive from another area.
#
# See ../README.md for the format of this file.

name: Flussi - Quota di mobilità in ingresso
category: Flussi
order: 50
index_value_unit_description: Rapporto fra utenti in arrivo da altre aree e utenti presenti
year_only: true
description: >-
  La quota di mobilità in ingresso misura la <strong>quota degli utenti presenti in un'area che
  arrivano da un'altra area</strong> (rapporto fra gli utenti in arrivo da altre aree e gli utenti
  presenti). Valori alti indicano località di tappa, raggiunte durante uno spostamento; valori bassi
  indicano località di destinazione o di pernottamento stabile. Il valore può superare 1 perché un
  utente può essere contato in più aree; è lasciato vuoto per le aree con meno di 100
  giornate-utente annue di presenza. {{flow_common}}

phenomena:
  - {name: quota_ingresso_combined, type: FlowIndicatorPhenomenon, source: flows_od, col: quota_ingresso_combined}
  - {name: quota_ingresso_tourist, type: FlowIndicatorPhenomenon, source: flows_od, col: quota_ingresso_tourist}
  - {name: quota_ingresso_visitor, type: FlowIndicatorPhenomenon, source: flows_od, col: quota_ingresso_visitor}

formula: quota_ingresso_combined
