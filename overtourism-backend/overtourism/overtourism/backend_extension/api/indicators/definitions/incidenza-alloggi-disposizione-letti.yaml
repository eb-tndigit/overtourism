# incidenza-alloggi-disposizione-letti
# Share of 'available' dwellings' beds over all accommodation beds.
#
# See ../README.md for the format of this file.

name: Incidenza Alloggi a disposizione (posti letto)
category: Strutture
order: 33
index_value_unit_description: Quota dei posti letto sul totale
description: >-
  Misura la quota dei <strong>posti letto degli alloggi a disposizione</strong> sul totale composto
  da alloggi turistici, alloggi a disposizione, strutture alberghiere ed extra-alberghiere (posti
  letto, non numero di strutture). Gli alloggi a disposizione (ad esempio le seconde case) non fanno
  parte dell'offerta ricettiva ufficiale: valori alti indicano un territorio con molti posti letto
  in abitazioni non stabilmente occupate. {{ispat_structures_source}} L'indice è annuale; le aree
  senza posti letto non hanno valore.

phenomena:
  - {name: letti_alloggi_turistici, type: BedsPhenomenon, source: structures, col: letti_alloggi_turistici}
  - {name: letti_alloggi_disp, type: BedsPhenomenon, source: structures, col: letti_alloggi_disp}
  - {name: letti_alb, type: BedsPhenomenon, source: structures, col: letti_alb}
  - {name: letti_exalb, type: BedsPhenomenon, source: structures, col: letti_exalb}

formula: letti_alloggi_disp / sum(letti_alloggi_turistici, letti_alloggi_disp, letti_alb, letti_exalb)
